name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # 清理所有环境变量中的空白字符
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId=$(echo "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" | tr -d '[:space:]')
          export ORG_GRADLE_PROJECT_signingInMemoryKey=$(echo "$ORG_GRADLE_PROJECT_signingInMemoryKey" | tr -d '[:space:]')
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$(echo "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" | tr -d '[:space:]')
          
          # 调试：打印长度（不打印内容）
          echo "Key ID length: ${#ORG_GRADLE_PROJECT_signingInMemoryKeyId}"
          echo "Key length: ${#ORG_GRADLE_PROJECT_signingInMemoryKey}"
          
          ./gradlew publishAllPublicationsToMavenCentralRepository